<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="95" fill="none" stroke="#11317d" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="#11317d"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Gavel & Cricket Bat Crossed Icon -->
  <g fill="#ffffff">
    <!-- Cricket Bat (angled) -->
    <rect x="70" y="88" width="40" height="10" rx="3" transform="rotate(-45 70 88)"/>
    <rect x="58" y="98" width="18" height="4" rx="1" transform="rotate(-45 58 98)"/>
    <!-- Gavel (angled opposite) -->
    <rect x="88" y="55" width="24" height="12" rx="2" transform="rotate(45 88 55)"/>
    <rect x="110" y="70" width="30" height="5" rx="1" transform="rotate(45 110 70)"/>
  </g>

  <!-- Text -->
  <text x="100" y="132" fill="#ffffff" font-family="'Arial Black', sans-serif" font-weight="900" font-size="15" text-anchor="middle">IPL AUCTION</text>
  <text x="100" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle">(6-8)</text>
</svg>
